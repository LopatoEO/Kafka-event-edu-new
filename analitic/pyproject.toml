[project]
name = "analitics-service"
version = "0.1.0"
description = ""
authors = [
    {name = "LopatoEO",email = "126246079+LopatoEO@users.noreply.github.com"}
]
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.135.1,<0.136.0)",
    "aiochclient (>=2.6.0,<3.0.0)",
    "uvicorn (>=0.42.0,<0.43.0)",
    "aiohttp (>=3.13.3,<4.0.0)",
    "dishka (>=1.9.1,<2.0.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "ruff (>=0.15.12,<0.16.0)"
]

[tool.ruff]
line-length = 81
target-version = "py313"
fix = true

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"



[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
